[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chakin"
version = "0.1.0"
description = "A tool to download pre-trained word vectors."
authors = [
    { name = "DevBench" }
]
dependencies = [
    "progressbar2",
    "numpy",
    "pandas",
    "requests",
]
requires-python = ">=3.6"

[tool.setuptools]
packages = ["chakin"]
